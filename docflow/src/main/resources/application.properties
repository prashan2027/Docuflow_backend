# ========================================
# APPLICATION CONFIGURATION
# ========================================
spring.application.name=docflow

# ========================================
# SERVER CONFIGURATION
# ========================================
server.port=8080
server.servlet.context-path=/

# ========================================
# SESSION CONFIGURATION (Critical for React Session-Based Auth)
# ========================================
# Session timeout (30 minutes of inactivity)
server.servlet.session.timeout=30m

# Cookie configuration for session management
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# ?? IMPORTANT: Set to 'true' in production with HTTPS
server.servlet.session.cookie.secure=false
# Allow cookie to be sent cross-origin (for React on different port)
server.servlet.session.cookie.path=/
# Cookie max age (-1 means session cookie, deleted when browser closes)
server.servlet.session.cookie.max-age=-1

# Session persistence (false = in-memory sessions)
server.servlet.session.persistent=false

# ========================================
# MYSQL DATABASE CONFIGURATION
# ========================================
spring.datasource.url=jdbc:mysql://localhost:3306/docflow?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ========================================
# MONGODB CONFIGURATION (for document storage)
# ========================================
spring.data.mongodb.uri=mongodb://localhost:27017/docflow

# ========================================
# LDAP CONFIGURATION
# ========================================
# LDAP Server URL
spring.ldap.urls=ldap://localhost:10389/

# Base DN - Root of your LDAP directory tree
spring.ldap.base=dc=example,dc=com

# Bind DN - Admin/Service account for LDAP queries
spring.ldap.username=uid=admin,ou=system

# Bind Password - Admin/Service account password
spring.ldap.password=secret

# ========================================
# CUSTOM LDAP PROPERTIES
# ========================================
# IMPORTANT: These are RELATIVE to spring.ldap.base
# Do NOT include dc=example,dc=com here

# Where to search for users in LDAP tree (relative to base DN)
app.ldap.userSearchBase=ou=users

# Filter to match username (uid attribute)
# {0} is replaced with the username entered by user
app.ldap.userSearchFilter=(uid={0})

# Where to search for groups/roles in LDAP tree (relative to base DN)
app.ldap.groupSearchBase=ou=groups

# Filter to find groups user belongs to
# {0} is replaced with user's full DN
app.ldap.groupSearchFilter=(uniqueMember={0})

# ========================================
# CORS CONFIGURATION
# ========================================
# ? Your React dev server URL
app.cors.allowed-origins=http://localhost:5173

# HTTP methods allowed from frontend
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS

# Headers allowed in requests
app.cors.allowed-headers=*

# Headers exposed to frontend
app.cors.exposed-headers=Authorization,Content-Type

# ?? CRITICAL: Must be true for session cookies to work
app.cors.allow-credentials=true

# How long browser can cache CORS preflight response (1 hour)
app.cors.max-age=3600

# ========================================
# LOGGING CONFIGURATION
# ========================================
# Spring Security debug logs (helpful during development)
logging.level.org.springframework.security=DEBUG

# LDAP debug logs (helpful during development)
logging.level.org.springframework.ldap=DEBUG

# Your application logs
logging.level.com.docuflow=DEBUG

# ========================================
# JACKSON (JSON Configuration)
# ========================================
# Pretty print JSON responses (development only)
spring.jackson.serialization.indent-output=true

# Date format for JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Timezone for dates
spring.jackson.time-zone=UTC

# ========================================
# ACTUATOR (Health Check Endpoints)
# ========================================
# Expose health and info endpoints
management.endpoints.web.exposure.include=health,info

# Show detailed health information
management.endpoint.health.show-details=always

# Health check endpoint will be at: /actuator/health
management.endpoints.web.base-path=/actuator

# ========================================
# ERROR HANDLING
# ========================================
# Include error message in response
server.error.include-message=always

# Include exception details (disable in production)
server.error.include-exception=true

# Include stack trace (disable in production)
server.error.include-stacktrace=on_param

